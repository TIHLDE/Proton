name: 'build -> push -> deploy'
on:
  push:
    branches: [main]
    # `./**` matcher ingenting — path-filtre er repo-relative uten `./`, så
    # push til main har aldri trigget denne workflowen. Eneste kjøringer siden
    # mai 2026 var manuelle workflow_dispatch, og merget kode ble derfor
    # liggende ubygget.
    paths:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: TIHLDE/tihlde-workflows/.github/workflows/_ci_ghcr.yml@main
    with:
      context: .
      dockerfile: ./Dockerfile

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    uses: TIHLDE/tihlde-workflows/.github/workflows/_notify_deploy.yml@main
    secrets:
      DEPLOY_RECEIVER_TOKEN: ${{ secrets.DEPLOY_RECEIVER_TOKEN }}
